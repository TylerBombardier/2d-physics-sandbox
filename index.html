<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="css/stylereset.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Simulation Sandbox</title>
</head>
<body>
    <div id="container">
        <div id="left-ui-panel" class="closed">
            <div id="ui-container">
                <div id="ui-content">
                    <md-filled-tonal-icon-button id="tool-grab">
                        <md-icon>pan_tool</md-icon>
                    </md-filled-tonal-icon-button>
                    <md-filled-tonal-icon-button id="tool-color">
                        <md-icon>format_paint</md-icon>
                    </md-filled-tonal-icon-button>
                    <md-filled-tonal-icon-button id="tool-eraser">
                        <md-icon>ink_eraser</md-icon>
                    </md-filled-tonal-icon-button>

                </div>
            </div>
            <div id="ui-handle">
                <span id="arrow" class="material-symbols-outlined">
                    arrow_menu_open
                </span>
            </div>
        </div>
        <div id="sim-area">

        </div>
    </div>
</body>
</html>
