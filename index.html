<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="css/stylereset.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes/light.css">
    <link rel="stylesheet" href="css/themes/dark.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Simulation Sandbox</title>
</head>
<body>
    <div id="container">
        <div id="left-ui-panel" class="closed">
            <div id="ui-container">
                <div id="ui-content">
                    <md-filled-tonal-icon-button class="tools" id="tool-grab">
                    <md-icon>pan_tool</md-icon>
                    </md-filled-tonal-icon-button>
                    <md-filled-tonal-icon-button class="tools" id="tool-color">
                        <md-icon>format_paint</md-icon>
                    </md-filled-tonal-icon-button>
                    <md-filled-tonal-icon-button class="tools" id="tool-eraser">
                        <md-icon>ink_eraser</md-icon>
                    </md-filled-tonal-icon-button>
                </div>
            
                <div id="ui-tool-options">
                    <div id="ui-grab" class="tool-panel hidden">
                        <label>Grab Radius</label><br>
                        <md-slider labeled min="0" max="1" step="0.01" value="0"></md-slider>

                        <br><label>Grab Strength</label><br>
                        <md-slider labeled min="0" max="1" step="0.01" value="0.2"></md-slider>
                    </div>

                    <div id="ui-color" class="tool-panel hidden">
                        <label>Brush Color</label><br>
                        <input type="color" id="brush-color" value="#ff0000">

                        <br><label>Brush Radius</label><br>
                        <md-slider labeled min="0" max="1" step="0.01" value="0"></md-slider>

                        <br><label>Color Static?</label><br>
                        <md-switch></md-switch>
                    </div>

                    <div id="ui-eraser" class="tool-panel hidden">
                        <label>Eraser Radius</label><br>
                        <md-slider labeled min="0" max="1" step="0.01" value="0"></md-slider>

                        <br><label>Erase Static?</label><br>
                        <md-switch></md-switch>
                    </div>
                </div>
            </div>
            <div id="ui-handle">
                <span id="arrow" class="material-symbols-outlined">
                    arrow_menu_open
                </span>
            </div>
        </div>
        <div id="sim-area">

        </div>
    </div>
</body>
</html>
